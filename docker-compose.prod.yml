# ==============================================================================
# MEDRYNX PRODUCTION DOCKER COMPOSE CONFIGURATION (docker-compose.prod.yml)
# Hardened for enterprise deployment, zero host port leakage, and resource limits
# ==============================================================================

services:
  # 1. PostgreSQL 16 Enterprise Database
  postgres:
    image: postgres:16-alpine
    container_name: medrynx-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medrynx_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password must be provided}
      POSTGRES_DB: ${POSTGRES_DB:-medrynx_prod_db}
    # No public host port mapping; accessible strictly inside internal Docker network
    expose:
      - "5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medrynx_admin} -d ${POSTGRES_DB:-medrynx_prod_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    networks:
      - medrynx-internal

  # 2. Kubo IPFS Daemon (Encrypted Content-Addressed Storage)
  ipfs:
    image: ipfs/kubo:v0.26.0
    container_name: medrynx-prod-ipfs
    restart: unless-stopped
    environment:
      LIBP2P_FORCE_PNET: 0
    # Restrict RPC API to internal network only; no public gateway exposure
    expose:
      - "5001"
      - "8080"
    volumes:
      - ipfs_prod_data:/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs dag stat /ipfs/bafybeifx7yeb55armcsxnw3afgahamenugzurlovalisaienejanahu3x4 || exit 0"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M
    networks:
      - medrynx-internal

  # 3. AI/ML Anomaly Scoring Microservice (FastAPI / IsolationForest)
  aiml:
    build:
      context: ./aiml
      dockerfile: Dockerfile
    container_name: medrynx-prod-aiml
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8000
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Internal service key required}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
    networks:
      - medrynx-internal

  # 4. Medrynx Core Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medrynx-prod-backend
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-medrynx_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-medrynx_prod_db}?schema=public&connection_limit=20&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET:?JWT secret must be provided}
      JWT_EXPIRES_IN: 7d
      AES_SECRET_KEY: ${AES_SECRET_KEY:?AES 256-bit KEK required}
      IPFS_API_URL: http://ipfs:5001
      IPFS_GATEWAY_URL: http://ipfs:8080/ipfs/
      IPFS_MOCK_ENABLED: "false"
      ML_SCORING_URL: http://aiml:8000/predict
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY:?Internal service key required}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:80}
      ANOMALY_THRESHOLD: 65
      STRICT_PROD_ENFORCE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      aiml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    networks:
      - medrynx-internal

  # 5. Production Web Client & Reverse Proxy (React / Nginx with TLS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medrynx-prod-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    networks:
      - medrynx-internal

volumes:
  postgres_prod_data:
    driver: local
  ipfs_prod_data:
    driver: local

networks:
  medrynx-internal:
    driver: bridge
